name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  notebook:
    name: Execute notebook and check outputs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import the shared figure style
        run: python -c "import viz_style; viz_style.apply_style(); print('viz_style ok')"

      - name: Execute the notebook end to end
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=600 NeuralNet_BreastCancer.ipynb

      - name: Check every figure and the results database were written
        run: |
          set -e
          for f in figures/01_loss_curve.png figures/02_roc_curve.png \
                   figures/03_confusion_matrix.png db/results.db \
                   model/weights.npz; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
            echo "ok: $f"
          done

      - name: Check the model still clears its accuracy floor
        run: python scripts/check_model.py

      - name: Check the browser demo has not drifted from the notebook's weights
        run: |
          python scripts/export_web.py
          git diff --exit-code -- docs/ || {
            echo "docs/*.json is stale. Run scripts/export_web.py and commit the result."
            exit 1
          }
